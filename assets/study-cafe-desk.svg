<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" aria-hidden="true">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3d2e"/>
      <stop offset="100%" stop-color="#3a251a"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5f0e8"/>
      <stop offset="100%" stop-color="#ece6db"/>
    </linearGradient>
    <linearGradient id="coffee-liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a2c17"/>
      <stop offset="100%" stop-color="#2a1a0e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf8f4"/>
      <stop offset="100%" stop-color="#f0ebe1"/>
    </linearGradient>
  </defs>
  
  <!-- 桌面 -->
  <rect x="0" y="180" width="400" height="100" rx="4" fill="url(#desk)"/>
  <rect x="0" y="178" width="400" height="4" rx="2" fill="#6b4a38" opacity=".5"/>
  
  <!-- 桌面纹理 -->
  <line x1="0" y1="200" x2="400" y2="200" stroke="#4a2c17" stroke-width=".5" opacity=".3"/>
  <line x1="0" y1="230" x2="400" y2="230" stroke="#4a2c17" stroke-width=".5" opacity=".2"/>
  
  <!-- 书本 - 左侧 -->
  <rect x="40" y="135" width="90" height="43" rx="3" fill="#2d4a3a"/>
  <rect x="42" y="137" width="86" height="39" rx="2" fill="#3d6b4f"/>
  <rect x="40" y="128" width="85" height="43" rx="3" fill="#6b2d3e"/>
  <rect x="42" y="130" width="81" height="39" rx="2" fill="#8b3a50"/>
  <rect x="40" y="120" width="80" height="43" rx="3" fill="#c4956a"/>
  <rect x="42" y="122" width="76" height="39" rx="2" fill="#d4a57a"/>
  <line x1="60" y1="128" x2="100" y2="128" stroke="#fff" stroke-width="1.5" opacity=".6"/>
  <line x1="60" y1="134" x2="90" y2="134" stroke="#fff" stroke-width="1" opacity=".4"/>
  
  <!-- 翻开的书 - 右侧 -->
  <path d="M240 140 L240 178 Q280 172 320 178 L320 140 Q280 146 240 140Z" fill="url(#page)" stroke="#d9d0c2" stroke-width="1"/>
  <path d="M240 140 Q280 146 320 140" stroke="#d9d0c2" stroke-width="1" fill="none"/>
  <line x1="255" y1="150" x2="295" y2="150" stroke="#c4956a" stroke-width="1" opacity=".5"/>
  <line x1="255" y1="156" x2="290" y2="156" stroke="#c4956a" stroke-width="1" opacity=".4"/>
  <line x1="255" y1="162" x2="285" y2="162" stroke="#c4956a" stroke-width="1" opacity=".3"/>
  <line x1="255" y1="168" x2="280" y2="168" stroke="#c4956a" stroke-width="1" opacity=".2"/>
  
  <!-- 笔记本 -->
  <rect x="155" y="130" width="65" height="48" rx="3" fill="#5c3d2e"/>
  <rect x="157" y="132" width="61" height="44" rx="2" fill="#faf8f4"/>
  <line x1="165" y1="142" x2="205" y2="142" stroke="#c4956a" stroke-width="1" opacity=".4"/>
  <line x1="165" y1="148" x2="200" y2="148" stroke="#c4956a" stroke-width="1" opacity=".3"/>
  <line x1="165" y1="154" x2="195" y2="154" stroke="#c4956a" stroke-width="1" opacity=".2"/>
  <circle cx="187" cy="168" r="3" fill="#b8965a" opacity=".6"/>
  
  <!-- 咖啡杯 -->
  <ellipse cx="340" cy="160" rx="28" ry="8" fill="#d9d0c2"/>
  <path d="M312 160 L316 120 Q340 116 364 120 L368 160Z" fill="url(#cup)" stroke="#d9d0c2" stroke-width="1"/>
  <ellipse cx="340" cy="120" rx="24" ry="7" fill="#faf8f4" stroke="#d9d0c2" stroke-width="1"/>
  <ellipse cx="340" cy="120" rx="20" ry="5.5" fill="url(#coffee-liquid)"/>
  
  <!-- 咖啡杯把手 -->
  <path d="M368 135 Q380 135 380 148 Q380 158 368 158" fill="none" stroke="#d9d0c2" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- 咖啡拉花 -->
  <path d="M332 120 Q340 117 348 120" fill="none" stroke="#f5f0e8" stroke-width="1.5" opacity=".7"/>
  <ellipse cx="340" cy="119" rx="4" ry="2" fill="#f5f0e8" opacity=".5"/>
  
  <!-- 热气 -->
  <path d="M332 108 Q334 100 332 92" fill="none" stroke="#d9d0c2" stroke-width="1.5" opacity=".3" stroke-linecap="round"/>
  <path d="M340 106 Q342 98 340 90" fill="none" stroke="#d9d0c2" stroke-width="1.5" opacity=".25" stroke-linecap="round"/>
  <path d="M348 108 Q350 100 348 92" fill="none" stroke="#d9d0c2" stroke-width="1.5" opacity=".2" stroke-linecap="round"/>
  
  <!-- 钢笔 -->
  <rect x="130" y="155" width="22" height="4" rx="2" fill="#2a1f18" transform="rotate(-15 141 157)"/>
  <polygon points="130,157 125,158.5 130,160" fill="#b8965a" transform="rotate(-15 127 158)"/>
  
  <!-- 眼镜 -->
  <circle cx="105" cy="185" r="12" fill="none" stroke="#5c3d2e" stroke-width="1.5"/>
  <circle cx="135" cy="185" r="12" fill="none" stroke="#5c3d2e" stroke-width="1.5"/>
  <line x1="117" y1="185" x2="123" y2="185" stroke="#5c3d2e" stroke-width="1.5"/>
  <line x1="93" y1="185" x2="88" y2="182" stroke="#5c3d2e" stroke-width="1.5"/>
  <line x1="147" y1="185" x2="152" y2="182" stroke="#5c3d2e" stroke-width="1.5"/>
  
  <!-- 植物 - 右下角 -->
  <rect x="365" y="150" width="20" height="28" rx="3" fill="#5c3d2e"/>
  <ellipse cx="375" cy="148" rx="14" ry="10" fill="#2d4a3a"/>
  <ellipse cx="370" cy="145" rx="8" ry="6" fill="#3d6b4f"/>
  <ellipse cx="380" cy="143" rx="7" ry="5" fill="#4a7d5f"/>
  
  <!-- 装饰线条 -->
  <line x1="20" y1="178" x2="380" y2="178" stroke="#b8965a" stroke-width=".5" opacity=".3"/>
</svg>
